plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.1.38' apply false
    id 'net.minecraftforge.gradle' version '[6.0,6.2)' apply false
    id 'org.spongepowered.mixin' version '0.7.+' apply false
}

def forgeTarget = project.findProperty('loader')?.toString()?.equalsIgnoreCase('forge') ?: false
if (forgeTarget) {
    apply plugin: 'net.minecraftforge.gradle'
    apply plugin: 'org.spongepowered.mixin'
} else {
    apply plugin: 'net.neoforged.gradle.userdev'
}

version = mod_version
group = mod_group_id

base {
    archivesName = forgeTarget ? "${mod_id}-forge-${minecraft_version}" : "${mod_id}-neoforge-${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

def rootFullSlabs = file('src/main/java/io/github/favasur/fullslabs').toPath().toAbsolutePath().normalize()

def excludeNeoForgeFullSlabsFiles = { element ->
    def path = element.file.toPath().toAbsolutePath().normalize()
    if (!path.startsWith(rootFullSlabs)) {
        return false
    }
    def relative = rootFullSlabs.relativize(path).toString().replace(File.separatorChar, '/' as char)
    return relative == 'FullSlabs.java'
            || relative == 'SlabRegistry.java'
            || relative == 'config/Controls.java'
            || relative == 'variants/VariantRegistry.java'
            || relative == 'client/models/MixedSlabModel.java'
            || relative == 'client/variants/VariantModelBaker.java'
            || relative.startsWith('loot/')
            || relative.startsWith('compat/')
            || relative.startsWith('config/neoforge/')
            || relative.startsWith('neoforge/')
}

sourceSets {
    main {
        if (forgeTarget) {
            java.setSrcDirs([
                    'src/forge/main/java',
                    'shared/flexiblepainting-1211/src/main/java',
                    'shared/fullslabs-1211/src/main/java',
                    'src/main/java/io/github/favasur/fullslabs'
            ])
            java.exclude(excludeNeoForgeFullSlabsFiles)
            resources.setSrcDirs(['src/forge/main/resources'])
        } else {
            java.srcDir('shared/flexiblepainting-1211/src/main/java')
        }
    }
}

if (forgeTarget) {
    minecraft {
        mappings channel: 'official', version: minecraft_version

        runs {
            client {
                workingDirectory project.file('run/forge')
                property 'forge.logging.markers', 'REGISTRIES'
                property 'forge.logging.console.level', 'debug'
                mods {
                    buildertools {
                        source sourceSets.main
                    }
                }
            }
            server {
                workingDirectory project.file('run/forge')
                property 'forge.logging.markers', 'REGISTRIES'
                property 'forge.logging.console.level', 'debug'
                args '--nogui'
                mods {
                    buildertools {
                        source sourceSets.main
                    }
                }
            }
        }
    }

    repositories {
        mavenCentral()
        maven { url = 'https://maven.minecraftforge.net' }
    }

    dependencies {
        minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
        compileOnly 'org.spongepowered:mixin:0.8.7'
        annotationProcessor 'org.spongepowered:mixin:0.8.7:processor'
        implementation 'io.github.llamalad7:mixinextras-forge:0.5.4'
        compileOnly 'io.github.llamalad7:mixinextras-common:0.5.4'
    }

    mixin {
        add sourceSets.main, 'buildertools.refmap.json'
        config 'buildertools.mixins.json'
        config 'buildertools.flexiblepainting.mixins.json'
        config 'fullslabs.mixins.json'
    }

    tasks.withType(ProcessResources).configureEach {
        var replaceProperties = [
                minecraft_version_range: minecraft_version_range,
                forge_version          : forge_version,
                loader_version_range   : loader_version_range,
                mod_id                 : mod_id,
                mod_name               : mod_name,
                mod_license            : mod_license,
                mod_version            : mod_version,
        ]
        inputs.properties replaceProperties
        filesMatching(['META-INF/mods.toml']) {
            expand replaceProperties
        }
        from('src/main/resources') {
            include 'assets/fullslabs/**'
        }
    }
} else {
    runs {
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'forge.logging.console.level', 'debug'
            workingDirectory project.layout.projectDirectory.dir('run').dir(name)
            modSource project.sourceSets.main
        }

        client {
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            argument '--nogui'
        }

        gameTestServer {
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
    }

    configurations {
        runtimeClasspath.extendsFrom localRuntime
    }

    dependencies {
        implementation "net.neoforged:neoforge:${neo_version}"
        implementation 'io.github.llamalad7:mixinextras-neoforge:0.3.5'
    }

    tasks.withType(ProcessResources).configureEach {
        var replaceProperties = [
                minecraft_version      : minecraft_version,
                minecraft_version_range: minecraft_version_range,
                neo_version            : neo_version,
                loader_version_range   : loader_version_range,
                mod_id                 : mod_id,
                mod_name               : mod_name,
                mod_license            : mod_license,
                mod_version            : mod_version,
        ]
        inputs.properties replaceProperties
        filesMatching(['META-INF/neoforge.mods.toml']) {
            expand replaceProperties
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.register('collectJars') {
    dependsOn tasks.named('jar')
    doLast {
        def output = rootProject.file('dist')
        output.mkdirs()
        copy {
            from tasks.named('jar').get().archiveFile
            into output
            rename { "${mod_id}-${forgeTarget ? 'forge' : 'neoforge'}-${minecraft_version}-${mod_version}.jar" }
        }
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}
