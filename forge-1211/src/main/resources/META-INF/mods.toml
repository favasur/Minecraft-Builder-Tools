modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="Builder Tools contributors"
description='''
WorldEdit-style builder tools for Minecraft (Forge 1.21.1).

Includes:
- Selection Tool: mark two corners with left/right click, see the region rendered in-world, then copy / paste / fill / undo / stretch.
- Entity Tool: right-click an entity to select it, then move, rotate, teleport, duplicate or delete it.

All operations are server-validated and work in single player and multiplayer.
'''

[[dependencies.${mod_id}]]
modId="forge"
type="required"
versionRange="[${forge_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[mixins]]
config="buildertools.mixins.json"
