plugins {
    // No-remap Loom variant: 26.2 ships the client jar pre-mapped with official
    // Mojang names (no separate mappings artifact exists), so remapping is disabled.
    id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT'
    id 'java-library'
    id 'maven-publish'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_id}-fabric-${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

sourceSets {
    main {
        java.srcDir('../shared/flexiblepainting-262/src/main/java')
    }
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.register('collectJars') {
    dependsOn tasks.named('jar')
    doLast {
        def output = file('../dist')
        output.mkdirs()
        copy {
            from tasks.named('jar').get().archiveFile
            into output
            rename { "${mod_id}-fabric-${minecraft_version}-${mod_version}.jar" }
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}
