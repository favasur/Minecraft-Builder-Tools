pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
        maven { url = 'https://maven.fabricmc.net' }
        maven { url = 'https://maven.minecraftforge.net' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'builder-tools'

// The root project provides NeoForge 1.21.1 by default and Forge 1.21.1 with
// -Ploader=forge. The remaining 26.2 loader/version combinations are standalone projects.
