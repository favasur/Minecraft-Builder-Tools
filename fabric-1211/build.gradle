plugins {
    id 'fabric-loom' version '1.11.3'
    id 'java-library'
    id 'maven-publish'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_id}-fabric-${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets {
    main {
        java.srcDir('../shared/flexiblepainting-1211/src/main/java')
        java.srcDir('../shared/fullslabs-1211/src/main/java')
        // Canonical FullSlabs + Smooth Terrain sources. Only the NeoForge loader/render/network
        // entrypoints are excluded here (the module supplies Fabric adapters). The FullSlabs
        // mixin tree MUST stay in the Fabric build (fullslabs.mixins.json references it), so the
        // exclusions are explicit per canonical tree rather than a global 'mixin/**' pattern that
        // would silently drop it and crash the game at mixin prepare. The 1.21.1 graft is a pure
        // mixin graft (SlabVertical/SlabBlockMixin + the vanilla-only VerticalSlabModel), so only
        // the two loader-neutral bootstrap files come from shared/fullslabs-1211.
        java.srcDir('../src/main/java/io/github/favasur')
        java.exclude 'smoothterrain/client/**'
        java.exclude 'smoothterrain/hooks/ClientHooks.java'
        java.exclude 'smoothterrain/hooks/Hooks.java'
        java.exclude 'smoothterrain/network/**'
        java.exclude 'smoothterrain/neoforge/**'
        java.exclude 'smoothterrain/mixin/**'
        java.exclude 'smoothterrain/compat/**'
        java.exclude 'smoothterrain/config/neoforge/**'
        java.exclude 'smoothterrain/config/SmoothTerrainConfigImpl.java'
        java.exclude 'fullslabs/FullSlabs.java'
        java.exclude 'fullslabs/config/Controls.java'
        java.exclude 'fullslabs/neoforge/**'
    }
}

loom {
    // The NeoForge/Forge ports use Mojang official mappings; keep the code identical by
    // using the same mappings here instead of Yarn.
    officialMojangMappings()
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    modImplementation 'io.github.llamalad7:mixinextras-fabric:0.5.4'
}

tasks.register('collectJars') {
    dependsOn tasks.named('jar')
    doLast {
        def output = file('../dist')
        output.mkdirs()
        copy {
            from tasks.named('jar').get().archiveFile
            into output
            rename { "${mod_id}-fabric-${minecraft_version}-${mod_version}.jar" }
        }
    }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}
