plugins {
    id 'fabric-loom' version '1.11.3'
    id 'java-library'
    id 'maven-publish'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_id}-fabric-${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets {
    main {
        java.srcDir('../shared/flexiblepainting-1211/src/main/java')
        java.srcDir('../shared/fullslabs-1211/src/main/java')
        java.srcDir('../src/main/java/io/github/favasur/fullslabs')
        java.exclude 'FullSlabs.java'
        java.exclude 'SlabRegistry.java'
        java.exclude 'config/Controls.java'
        java.exclude 'variants/VariantRegistry.java'
        java.exclude 'client/models/MixedSlabModel.java'
        java.exclude 'client/variants/VariantModelBaker.java'
        java.exclude 'loot/**'
        java.exclude 'compat/**'
        java.exclude 'config/neoforge/**'
        java.exclude 'neoforge/**'
    }
}

tasks.named('processResources') {
    from('../src/main/resources') {
        include 'assets/fullslabs/**'
    }
}

loom {
    // The NeoForge/Forge ports use Mojang official mappings; keep the code identical by
    // using the same mappings here instead of Yarn.
    officialMojangMappings()
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    modImplementation 'io.github.llamalad7:mixinextras-fabric:0.5.4'
}

tasks.register('collectJars') {
    dependsOn tasks.named('jar')
    doLast {
        def output = file('../dist')
        output.mkdirs()
        copy {
            from tasks.named('jar').get().archiveFile
            into output
            rename { "${mod_id}-fabric-${minecraft_version}-${mod_version}.jar" }
        }
    }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}
