modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="Builder Tools contributors"
description='''
WorldEdit-style builder tools for Minecraft (Forge 26.2).

Includes:
- Selection Tool: mark two corners with left/right click, see the region rendered in-world, then copy / paste / fill / undo.
- Entity Tool: right-click an entity to select it, then move (scroll), nudge up/down (sneak+scroll), rotate, teleport to a block, duplicate or delete it.
- Ruler, Laser, Paint, Scatter and Smooth tools with Hytale-style visuals.
- Creative settings window with world time/weather, flight speed, no clip, air placement, brush and rendering options.
- Full command set: /set, /replace, /fill, /copy, /paste, /undo, /stretch, /wand and friends, applied to the current selection.
'''

[[dependencies.${mod_id}]]
modId="forge"
mandatory=true
versionRange="${loader_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[mixins]]
config="buildertools.flexiblepainting.mixins.json"
