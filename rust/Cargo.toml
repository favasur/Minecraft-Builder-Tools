[package]
name = "buildertools"
version = "0.3.0"
edition = "2024"
publish = false
autobins = false
autoexamples = false
autotests = false
autobenches = false

[[example]]
name = "bench"
path = "examples/bench.rs"

[lib]
name = "buildertools"

[dependencies]
horizon-mod-api = { path = "../.horizon/sdk/api/crates/horizon-mod-api" }

[profile.release]
opt-level = 3
lto = "thin"
